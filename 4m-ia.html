<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4M Vazamentos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#f2f2f2;--mut:#8a8a8a;--line:#2a2a2a;--card:#0c0c0c;--card2:#161616;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f2f2f2}}
:root[data-theme="dark"]{--bg:#000;--fg:#f2f2f2}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#000}
.blob{opacity:.4;position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;background:radial-gradient(circle,#fff 0%,#7d7d7d 40%,transparent 70%);animation:flow 18s ease-in-out infinite alternate}
.b1{width:60vmax;height:40vmax;left:-15vmax;top:5vh;animation-duration:22s}
.b2{width:50vmax;height:50vmax;right:-20vmax;top:-10vmax;opacity:.5;animation-duration:26s;animation-delay:-8s}
.b3{width:70vmax;height:30vmax;left:15vw;bottom:-18vmax;opacity:.45;animation-duration:30s;animation-delay:-14s}
.hole{position:absolute;border-radius:50%;background:#000;filter:blur(40px);width:30vmax;height:24vmax;left:38vw;top:2vh;animation:flow 24s ease-in-out infinite alternate-reverse}
@keyframes flow{0%{transform:translate(0,0) scale(1) rotate(0)}50%{transform:translate(6vw,-5vh) scale(1.2) rotate(25deg)}100%{transform:translate(-5vw,6vh) scale(.9) rotate(-20deg)}}
.grain{position:absolute;inset:-50%;opacity:.9;mix-blend-mode:overlay;pointer-events:none;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1.6 -.3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,#000 100%)}
nav{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(820px,calc(100% - 28px));z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(8,8,8,.65);backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.01em}
.logo svg{width:26px;height:26px}
.btn{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--fg);padding:8px 16px;font-size:14px;font-weight:500;transition:background .2s,border-color .2s}
.btn:hover{background:#222;border-color:#555}
.btn:focus-visible,.ic:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}
main{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px 22px 60px}
h1{margin:0;font-size:clamp(46px,11vw,150px);line-height:.95;font-weight:600;letter-spacing:-.05em;background:linear-gradient(180deg,#fff 20%,#9a9a9a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:26px 0 38px;color:var(--mut);font-size:clamp(16px,2.4vw,21px);max-width:34ch;line-height:1.4}
.cta{font:inherit;cursor:pointer;background:#fff;color:#000;border:0;border-radius:999px;padding:16px 30px;font-size:16px;font-weight:600;transition:transform .2s,box-shadow .2s;box-shadow:0 0 0 0 rgba(255,255,255,.4)}
.cta:hover{transform:translateY(-2px);box-shadow:0 0 40px 2px rgba(255,255,255,.25)}
.cta:focus-visible{outline:2px solid #fff;outline-offset:4px}
.hint{margin-top:18px;font-size:13px;color:#666}
/* chat */
.ov{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}
.ov.open{display:flex;animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.chat{width:min(720px,100%);height:min(680px,100%);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.ch b{font-weight:600}.ch span{color:var(--mut);font-size:13px;margin-left:8px}
.ic{background:none;border:1px solid transparent;color:var(--mut);cursor:pointer;border-radius:8px;width:34px;height:34px;font-size:18px;display:grid;place-items:center}
.ic:hover{color:#fff;background:var(--card2)}
#msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.m{max-width:82%;padding:11px 15px;border-radius:14px;line-height:1.5;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.bot{align-self:flex-start;background:var(--card2);border:1px solid var(--line)}
.m.me{align-self:flex-end;background:#f2f2f2;color:#000}
.m img{display:block;max-width:100%;max-height:180px;border-radius:8px;margin-top:8px}
.m.q{font-weight:700;letter-spacing:.02em}
.cur::after{content:"";display:inline-block;width:7px;height:1em;background:#fff;margin-left:3px;vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.comp{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.stat{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px}
.comp.lock .stat{color:#bbb}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.th{position:relative}.th img{height:56px;width:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.th button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:#fff;color:#000;cursor:pointer;font-size:12px;line-height:1}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;font:inherit;font-size:15px;color:var(--fg);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;max-height:120px;min-height:44px}
textarea:disabled{opacity:.45;cursor:not-allowed}
.send{background:#fff;color:#000;border:0;border-radius:12px;width:44px;height:44px;cursor:pointer;font-size:18px;font-weight:700}
.comp.lock .send,.comp.lock .att{opacity:.35;pointer-events:none}
.att{border:1px solid var(--line);background:var(--card2);color:var(--fg);width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:18px}
@media (prefers-reduced-motion:reduce){.blob,.hole,.cur::after{animation:none}}
@media (max-width:520px){.ov{padding:0}.chat{border-radius:0;height:100%}}

.glow{position:absolute;left:50%;top:40%;width:80vmax;height:55vmax;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,255,255,.32),rgba(255,255,255,.08) 55%,transparent);filter:blur(30px);mix-blend-mode:screen;animation:pulse 7s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55;transform:translate(-50%,-50%) scale(.95)}to{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.btn .i{margin-right:6px}
.pre{background:#000;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0 2px;overflow-x:auto;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
.err{color:#bbb;font-size:13px;text-align:center}
h1{text-shadow:0 0 60px rgba(255,255,255,.25)}

<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="hole"></div><div class="ban"></div><div class="glow"></div><div class="grain"></div><div class="vig"></div></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
<symbol id="i-unlock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></symbol>
<symbol id="i-clip" viewBox="0 0 24 24"><path d="M20 11l-8 8a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-8 8a2 2 0 0 1-3-3l7-7"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/></symbol>
<symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></symbol>
</defs></svg>
<nav>
  <div class="logo">
    4M Vazamentos
  </div>
  <button class="btn" data-open>Entrar</button>
</nav>

<main>
  <h1>4M Vazamentos</h1>
  <p class="sub">Crie seu bot de Discord conversando com a IA.</p>
  <button class="cta" data-open>Clique aqui e comece a criar</button>
  <div class="hint"><svg class="i" aria-hidden="true"><use href="#i-spark"/></svg> Sem código. Descreva, envie prints e pronto.</div>
</main>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="Chat da 4M Vazamentos">
  <div class="chat">
    <div class="ch"><div><b>4M Vazamentos</b><span>Criador de bots</span></div><div><button class="btn" id="newbot" style="padding:6px 12px;font-size:13px"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg> Novo bot</button> <button class="ic" id="close" aria-label="Fechar chat"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div></div>
    <div id="msgs" aria-live="polite"></div>
    <div class="comp lock" id="comp">
      <div class="stat" id="stat"><svg class="i" aria-hidden="true"><use href="#i-lock"/></svg> Chat bloqueado</div>
      <div class="thumbs" id="thumbs"></div>
      <div class="row">
        <button class="att" id="attb" aria-label="Anexar print"><svg class="i" aria-hidden="true"><use href="#i-clip"/></svg></button>
        <input type="file" id="file" accept="image/*" multiple hidden>
        <textarea id="inp" rows="1" placeholder="Chat bloqueado..." disabled></textarea>
        <button class="send" id="send" aria-label="Enviar"><svg class="i" aria-hidden="true"><use href="#i-send"/></svg></button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var ICO=function(n){return '<svg class="i" aria-hidden="true"><use href="#i-'+n+'"/></svg>'};
  var ov=document.getElementById("ov"),msgs=document.getElementById("msgs"),comp=document.getElementById("comp"),
      inp=document.getElementById("inp"),stat=document.getElementById("stat"),file=document.getElementById("file"),
      thumbs=document.getElementById("thumbs"),started=false,pending=[],hist=[],sample=null,db=null,uid=null,busy=false;
  var SYS="Você é a 4M Vazamentos, uma criadora de bots de Discord. Responda sempre em português do Brasil, de forma curta e direta. Entenda o que o usuário quer (comandos, moderação, música, tickets, economia, boas-vindas, etc.), use os prints de referência quando houver e faça no máximo 1 pergunta por vez. Quando tiver informação suficiente, entregue o bot completo em discord.js v14 (Node.js) dentro de blocos de código, com instruções curtas para rodar. Nunca peça nem escreva tokens ou chaves reais; use process.env.DISCORD_TOKEN.";
  var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
  function scroll(){msgs.scrollTop=msgs.scrollHeight}
  function add(cls){var d=document.createElement("div");d.className="m "+cls;msgs.appendChild(d);scroll();return d}
  function render(d,text){
    d.textContent="";
    text.split("```").forEach(function(p,k){
      if(k%2){var pre=document.createElement("pre");pre.className="pre";pre.textContent=p.replace(/^[a-z]*\n/i,"");d.appendChild(pre)}
      else if(p){d.appendChild(document.createTextNode(p))}
    });
  }
  async function say(text,extra){
    var d=add("bot "+(extra||""));d.classList.add("cur");
    for(var i=0;i<text.length;i++){d.textContent+=text[i];scroll();await sleep(text[i]==="."||text[i]==="?"?220:24)}
    d.classList.remove("cur");await sleep(350);
  }
  function setStat(ic,t){stat.innerHTML=ICO(ic)+" "+t}
  function lock(t){comp.classList.add("lock");inp.disabled=true;inp.placeholder="Chat bloqueado...";setStat("lock",t||"Chat bloqueado")}
  function unlock(){comp.classList.remove("lock");inp.disabled=false;inp.placeholder="Descreva seu bot ou cole um print...";setStat("unlock","Chat liberado"+(uid?" · salvo no banco de dados":" · salvo neste navegador"));inp.focus()}

  async function boot(){
    try{sample=await claude.use("sample")}catch(e){}
    try{
      var u=await claude.use("user");db=await claude.use("db");
      if(u&&db){uid=await u.id()}
    }catch(e){db=null}
  }
  var booted=boot();
  function ref(id){return db.collection("data/users/"+uid).doc(id)}
  async function save(){
    if(!db||!uid){try{localStorage.setItem("4mia:current",JSON.stringify({messages:hist,updated:Date.now()}))}catch(e){}return}
    try{await ref("current").set({messages:hist,updated:Date.now()})}catch(e){}
  }
  async function load(){
    if(!db||!uid){try{var l=JSON.parse(localStorage.getItem("4mia:current")||"null");return l&&l.messages?l.messages:null}catch(e){return null}}
    try{var s=await ref("current").get();return s.exists?(s.data().messages||[]):null}catch(e){return null}
  }
  async function intro(){
    lock();
    await say("Olá! Eu sou a 4M Vazamentos.");
    await say("Eu crio bots de Discord a partir da sua ideia. Você pode escrever e mandar prints de referência.");
    await say("COMO VOCÊ QUER SEU BOT?","q");
    hist=[{role:"assistant",content:"COMO VOCÊ QUER SEU BOT?"}];
    unlock();
  }
  async function start(){
    lock("Carregando...");await booted;
    var old=await load();
    if(old&&old.length>1){
      hist=old;
      hist.forEach(function(m){render(add(m.role==="user"?"me":"bot"),m.content)});
      unlock();
    }else{intro()}
  }
  function open(){ov.classList.add("open");if(!started){started=true;start()}else if(!inp.disabled){inp.focus()}}
  function close(){ov.classList.remove("open")}
  document.querySelectorAll("[data-open]").forEach(function(b){b.addEventListener("click",open)});
  document.getElementById("close").addEventListener("click",close);
  document.addEventListener("keydown",function(e){if(e.key==="Escape")close()});

  document.getElementById("newbot").addEventListener("click",async function(){
    if(busy)return;
    if(db&&uid&&hist.length>1){try{await ref("bot_"+Date.now()).set({messages:hist,updated:Date.now()})}catch(e){}}
    else if(hist.length>1){try{var a=JSON.parse(localStorage.getItem("4mia:bots")||"[]");a.push({messages:hist,updated:Date.now()});localStorage.setItem("4mia:bots",JSON.stringify(a));localStorage.removeItem("4mia:current")}catch(e){}}
    msgs.innerHTML="";hist=[];pending=[];renderThumbs();intro();
  });

  function addImgs(files){
    Array.prototype.forEach.call(files,function(f){
      if(!f.type.startsWith("image/"))return;
      pending.push({url:URL.createObjectURL(f),blob:f});renderThumbs();
    });
  }
  function renderThumbs(){
    thumbs.innerHTML="";
    pending.forEach(function(p,i){
      var w=document.createElement("div");w.className="th";
      var im=document.createElement("img");im.src=p.url;im.alt="Print anexado";
      var x=document.createElement("button");x.innerHTML=ICO("x");x.setAttribute("aria-label","Remover print");
      x.onclick=function(){pending.splice(i,1);renderThumbs()};
      w.appendChild(im);w.appendChild(x);thumbs.appendChild(w);
    });
  }
  document.getElementById("attb").addEventListener("click",function(){file.click()});
  file.addEventListener("change",function(){addImgs(file.files);file.value=""});
  inp.addEventListener("paste",function(e){var it=e.clipboardData&&e.clipboardData.files;if(it&&it.length){addImgs(it)}});
  inp.addEventListener("input",function(){inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,120)+"px"});

  async function send(){
    if(inp.disabled||busy)return;
    var t=inp.value.trim();if(!t&&!pending.length)return;
    busy=true;
    var d=add("me");if(t)d.appendChild(document.createTextNode(t));
    var blobs=pending.map(function(p){return p.blob});
    pending.forEach(function(p){var im=document.createElement("img");im.src=p.url;im.alt="Print enviado";d.appendChild(im)});
    var n=blobs.length;pending=[];renderThumbs();inp.value="";inp.style.height="auto";scroll();
    var content=(t||"(sem texto)")+(n?"\n[Enviou "+n+" print(s) de referência]":"");
    hist.push({role:"user",content:content});
    lock("4M Vazamentos está respondendo...");
    var out=add("bot");out.classList.add("cur");out.textContent="";
    try{
      if(!sample)throw {code:"unavailable"};
      var opts={cache:false,onText:function(u){render(out,u.text);scroll()}};
      try{if(n&&(await sample.limits()).images){opts.images=blobs}}catch(e){}
      var r=await sample([{role:"user",content:SYS+"\n\n---\nConversa até agora:\n"+hist.slice(0,-1).map(function(m){return (m.role==="user"?"Usuário: ":"4M Vazamentos: ")+m.content}).join("\n")+"\n\nUsuário: "+content+"\n\nResponda como 4M Vazamentos."}],opts);
      render(out,r.text);hist.push({role:"assistant",content:r.text});await save();
    }catch(e){
      out.remove();hist.pop();
      var er=add("err");er.textContent=(e&&e.code==="rate_limited")?"Muitas mensagens seguidas. Espere um pouco e envie de novo.":(e&&e.code==="not_granted")?"Permissão negada. Aceite o pedido de acesso à IA e envie de novo.":"A IA não está disponível agora. Envie de novo.";
    }
    out.classList.remove("cur");
    unlock();busy=false;
  }
  document.getElementById("send").addEventListener("click",send);
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
})();
</script>
</body>
</html>
